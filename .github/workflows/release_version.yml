name: Publish new Version
on: workflow_dispatch

permissions:
  contents: write
  packages: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.set-tag.outputs.release-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump patch version
        id: bump_version
        run: |
          PKG="./analyzer-frontend/package.json"
          CURRENT=$(jq -r '.version // "0.0.0"' "$PKG")
          echo "Current Version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New Version: $NEW_VERSION"

          # Update package.json
          jq ".version=\"$NEW_VERSION\"" "$PKG" > "$PKG.tmp"
          mv "$PKG.tmp" "$PKG"

          # Git commit + Tag
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "$PKG"
          git commit -m "ci: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main --tags

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  publish-desktopApp-release:
    name: Create GitHub Release
    runs-on: ${{ matrix.platform }}
    needs: [determine-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend
        working-directory: ./analyzer-frontend
        run: |
            npm install
            npm run build

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            pkg-config \
            build-essential \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Tauri Action Build & Release
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./analyzer-frontend
          beforeBuildCommand: "npm install && npm run build"
          tagName: "v${{ needs.determine-version.outputs.release-tag }}"
          releaseName: "Release ${{ needs.determine-version.outputs.release-tag }}"
          releaseBody: "Automated release version ${{ needs.determine-version.outputs.release-tag }}"
          releaseDraft: false
          prerelease: false

  publish-docker-image:
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - publish-desktopApp-release
    steps:
      - uses: actions/checkout@v4
      - name: Build and push Image
        env:
          RELEASE_TAG: ${{ needs.determine-version.outputs.release-tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Version without v: $VERSION"
          docker login --username maxiking445 --password ${{secrets.GH_PAT}} ghcr.io 
          docker build . --tag ghcr.io/maxiking445/threema-chat-analyzer:latest
          docker build . --tag ghcr.io/maxiking445/threema-chat-analyzer:$VERSION
          docker push ghcr.io/maxiking445/threema-chat-analyzer:latest
          docker push ghcr.io/maxiking445/threema-chat-analyzer:$VERSION
